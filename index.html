<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注射器液压挖掘机 3D 数字实验</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="液压挖掘机 3D 实验区">
        <div class="topbar">
          <div>
            <p class="eyebrow">Fluid Mechanics Lab</p>
            <h1>注射器液压挖掘机 3D 数字实验</h1>
          </div>
          <div class="status-grid" aria-label="实验实时指标">
            <div>
              <span>压力</span>
              <strong id="pressureReadout">0.00 kPa</strong>
            </div>
            <div>
              <span>输出力</span>
              <strong id="forceReadout">0.00 N</strong>
            </div>
            <div>
              <span>效率</span>
              <strong id="efficiencyReadout">100%</strong>
            </div>
          </div>
        </div>

        <div class="stage-wrap">
          <div id="threeStage" aria-label="三维液压挖掘机运动模拟"></div>
          <div class="view-hint">拖动画面旋转视角</div>
          <div class="floating-readouts" aria-label="位移与流量读数">
            <div><span>输入位移</span><strong id="inputStrokeReadout">0.0 mm</strong></div>
            <div><span>输出位移</span><strong id="outputStrokeReadout">0.0 mm</strong></div>
            <div><span>流量</span><strong id="flowReadout">0.0 mL/s</strong></div>
          </div>
        </div>
      </section>

      <aside class="control-panel" aria-label="实验控制台">
        <section class="panel-section">
          <div class="section-heading">
            <h2>控制回路</h2>
            <button id="playToggle" class="primary-button" type="button">运行</button>
          </div>
          <div class="mode-grid" role="radiogroup" aria-label="当前观察回路">
            <label><input type="radio" name="circuit" value="boom" checked><span>主臂</span></label>
            <label><input type="radio" name="circuit" value="arm"><span>小臂</span></label>
            <label><input type="radio" name="circuit" value="bucket"><span>铲斗</span></label>
          </div>
          <div class="circuit-legend">
            <span><i class="swatch boom"></i>主臂缸回路</span>
            <span><i class="swatch arm"></i>小臂缸回路</span>
            <span><i class="swatch bucket"></i>铲斗缸回路</span>
          </div>
          <p class="principle-note">每种颜色表示一条独立液压回路：输入注射器推动水，经软管传到对应执行缸，再推动连杆转动。</p>
          <label class="slider-row circuit-slider">
            <span>主臂注射器</span>
            <input id="boomStroke" type="range" min="0" max="60" value="18" step="0.5">
            <output id="boomStrokeValue">18.0 mm</output>
          </label>
          <label class="slider-row circuit-slider">
            <span>小臂注射器</span>
            <input id="armStroke" type="range" min="0" max="60" value="16" step="0.5">
            <output id="armStrokeValue">16.0 mm</output>
          </label>
          <label class="slider-row circuit-slider">
            <span>铲斗注射器</span>
            <input id="bucketStroke" type="range" min="0" max="60" value="22" step="0.5">
            <output id="bucketStrokeValue">22.0 mm</output>
          </label>
          <label class="slider-row">
            <span>推动速度</span>
            <input id="pushSpeed" type="range" min="4" max="80" value="28" step="1">
            <output id="pushSpeedValue">28 mm/s</output>
          </label>
          <div class="button-row">
            <button id="resetButton" type="button">复位</button>
            <button id="sampleButton" type="button">记录数据</button>
          </div>
        </section>

        <section class="panel-section">
          <h2>几何与液体</h2>
          <label class="slider-row">
            <span>输入直径</span>
            <input id="inputDiameter" type="range" min="8" max="28" value="18" step="0.5">
            <output id="inputDiameterValue">18.0 mm</output>
          </label>
          <label class="slider-row">
            <span>输出直径</span>
            <input id="outputDiameter" type="range" min="8" max="35" value="24" step="0.5">
            <output id="outputDiameterValue">24.0 mm</output>
          </label>
          <label class="slider-row">
            <span>管长</span>
            <input id="tubeLength" type="range" min="20" max="180" value="75" step="5">
            <output id="tubeLengthValue">75 cm</output>
          </label>
        </section>

        <section class="panel-section">
          <h2>损失因素</h2>
          <label class="slider-row">
            <span>气泡比例</span>
            <input id="airBubble" type="range" min="0" max="30" value="4" step="1">
            <output id="airBubbleValue">4%</output>
          </label>
          <label class="slider-row">
            <span>摩擦系数</span>
            <input id="friction" type="range" min="0" max="45" value="10" step="1">
            <output id="frictionValue">10%</output>
          </label>
          <label class="slider-row">
            <span>泄漏率</span>
            <input id="leakage" type="range" min="0" max="25" value="2" step="1">
            <output id="leakageValue">2%</output>
          </label>
        </section>

        <section class="panel-section formula-panel">
          <h2>计算模型</h2>
          <dl>
            <div><dt>帕斯卡定律</dt><dd id="pascalFormula">P = F / A</dd></div>
            <div><dt>连续性方程</dt><dd id="continuityFormula">Q = A v</dd></div>
            <div><dt>输出位移</dt><dd id="strokeFormula">s₂ = V / A₂</dd></div>
          </dl>
        </section>

        <section class="panel-section data-panel">
          <div class="section-heading">
            <h2>实验记录</h2>
            <button id="clearLog" type="button">清空</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>回路</th>
                  <th>P/kPa</th>
                  <th>F/N</th>
                  <th>s₂/mm</th>
                  <th>η</th>
                </tr>
              </thead>
              <tbody id="logBody"></tbody>
            </table>
          </div>
        </section>
      </aside>
    </main>

    <script src="vendor/three.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
